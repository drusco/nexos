name: pull-requests

on:
  pull_request:
    branches:
      - main
      - next

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  code:
    name: Run Code Validation
    uses: ./.github/workflows/code-validation.yml

  security_audit:
    name: Security Audit (non-dev dependencies)
    uses: ./.github/workflows/security-audit.yml
    secrets: inherit

  unit_tests:
    name: Run Unit Tests
    uses: ./.github/workflows/unit-tests.yml
    secrets: inherit
    needs:
      - code
    if: success()
